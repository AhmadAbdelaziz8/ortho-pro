syntax = "proto3";

package orthopro;

service DiagnosticService{
    rpc GetDiagnostic(scanPayload) returns (diagnosticReport);
}

message scanPayload {
    // xray image in base64 format
    bytes image = 1;
    // brief clinical history of the patient (optional)
    string clinicalHistory = 2;
    // 
    bool isLastChunk = 3;
}

message diagnosticReport {
    string diagnosis = 1;
    // 
    bool isComplete = 2;
}
