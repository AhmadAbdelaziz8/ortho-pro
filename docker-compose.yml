services:
  # Go gRPC backend (Compose DNS hostname: orchestrator)
  orchestrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "50051"

  # the gRPC web proxy
  envoy:
    image: envoyproxy/envoy:v1.31.1
    ports:
      - "8080:8080"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml
    depends_on:
      - orchestrator

    # vector DB 
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT_STORAGE_PATH=/qdrant/storage

volumes:
  qdrant_data:
